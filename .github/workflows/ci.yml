name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  publication:
    # Generic publication-safety checks only. Public CI never receives a private
    # denylist, credentials, or model access, so private-term coverage is absent here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: node scripts/publication-check.ts --ci --worktree --tree HEAD --metadata HEAD --package
